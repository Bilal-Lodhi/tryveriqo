name: CI

# Runs on every push and pull request. No step calls a paid AI model: the AI
# provider is substituted at its boundary in every automated test, and
# scripts/smoke.mjs deliberately avoids the generation endpoint.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Run backend tests
        run: npm run test:backend

  console:
    name: Console (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/console
        run: flutter pub get

      - name: Analyze
        working-directory: apps/console
        run: flutter analyze

      - name: Test
        working-directory: apps/console
        run: flutter test

      - name: Verify formatting
        working-directory: apps/console
        run: dart format --output=none --set-exit-if-changed .

  container:
    name: Container image builds and fails closed
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t tryveriqo-ci:local .

      - name: Prove the image fails closed without secrets
        run: |
          set +e
          # Invoke the API directly rather than the entrypoint: the entrypoint
          # needs a database, and this check is about configuration validation.
          docker run --rm \
            -e ENVIRONMENT=production \
            --entrypoint node \
            tryveriqo-ci:local ./apps/api/dist/index.js > /tmp/startup.log 2>&1
          status=$?
          set -e
          cat /tmp/startup.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the API started in production without any credentials"
            exit 1
          fi
          grep -q "ASSESSMENT_API_TOKEN" /tmp/startup.log
          grep -q "ASSESSMENT_SESSION_SECRET" /tmp/startup.log
          grep -q "Refusing to start in production" /tmp/startup.log

      - name: Prove the tool surface fails closed without a token
        run: |
          set +e
          # Same idea for the MCP transport: in production it must refuse to
          # expose an unauthenticated datastore surface.
          docker run --rm \
            -e ENVIRONMENT=production \
            -e MONGODB_URI=mongodb://127.0.0.1:27017 \
            --entrypoint node \
            tryveriqo-ci:local ./packages/mcp-mongodb/dist/http-server-main.js > /tmp/mcp.log 2>&1
          status=$?
          set -e
          cat /tmp/mcp.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the MCP transport started in production without MCP_AUTH_TOKEN"
            exit 1
          fi
          grep -q "MCP_AUTH_TOKEN" /tmp/mcp.log

  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history so the secret scan can inspect every commit, and so a
          # force-push cannot hide a commit from the scan.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: No credential files or cloud project identifiers
        run: node scripts/guards/credential-guard.mjs

      - name: No retired identifiers in runtime code
        run: node scripts/guards/identifier-guard.mjs

      - name: No tracked environment file
        run: |
          # A tracked .env is a leak regardless of what the credential guard's
          # working-tree walk saw. Check what Git actually carries.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::an environment file is tracked by Git"
            exit 1
          fi
          echo "No tracked environment file."

      - name: No tracked build output
        run: |
          if git ls-files | grep -E '(^|/)(dist|build|\.dart_tool)/' ; then
            echo "::error::build output is tracked by Git"
            exit 1
          fi
          echo "No tracked build output."

      - name: Validate the gitleaks configuration parses
        run: |
          # A malformed config would otherwise make the scan below vacuous.
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source=/repo/.gitleaks.toml --config=/repo/.gitleaks.toml --redact \
            || true
          echo "gitleaks parsed .gitleaks.toml"

      - name: Secret scan
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
        run: |
          # Scan the commit range this event actually introduced, and fail loudly
          # if the range resolves to nothing. A scan that silently examines zero
          # commits is worse than no scan: it reports success.
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            # First push, a forced divergence, or a manual run: the before-SHA is
            # absent or unreachable, so there is no meaningful range. Fall back to
            # full-history detection rather than inventing one.
            BASE=""
            HEAD=""
          fi

          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Scanning range ${BASE}..${HEAD}"
            docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
              detect --source=/repo --config=/repo/.gitleaks.toml \
              --log-opts="${BASE}..${HEAD}" --redact --verbose --exit-code=1
          else
            echo "No usable commit range (first push, force-push or manual run). Scanning full history."
            docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
              detect --source=/repo --config=/repo/.gitleaks.toml \
              --redact --verbose --exit-code=1
          fi

      - name: Dependency audit (report only)
        run: |
          npm audit --audit-level=high --omit=dev || \
            echo "::warning::npm audit reported advisories; review before release"
